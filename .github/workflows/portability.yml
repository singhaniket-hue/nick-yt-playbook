name: portability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install FFmpeg and Poppler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg poppler --yes --no-progress

      - name: Install FFmpeg and Poppler (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ffmpeg-full poppler
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Compile Python sources
        run: uv run python -m compileall -q rabbithole scripts

      - name: Run tests
        run: uv run pytest
